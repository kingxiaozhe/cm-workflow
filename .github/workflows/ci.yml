name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  node18-authorities:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up minimum Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3aa1d7e6cbb # v4.4.0
        with:
          node-version: "18"

      - name: Check shared JavaScript authorities
        run: |
          ./scripts/cm-check-runtime.sh
          node --test scripts/cm-ai-admission.test.mjs scripts/cm-workflow-config.test.mjs scripts/cm-log-event.test.mjs scripts/cm-task-gate.test.mjs scripts/validate-test-cases.test.mjs

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3aa1d7e6cbb # v4.4.0
        with:
          node-version: "22"

      - name: Validate runtime contracts
        run: ./scripts/cm-check-runtime.sh

      - name: Validate public package
        run: python3 scripts/validate-public-repo.py

      - name: Scan current tree safety
        run: python3 scripts/scan-public-safety.py

      - name: Check Bash syntax
        run: find . -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Run shell compatibility fixtures
        run: bash scripts/test-shell-compat.sh

      - name: Run workflow config fixtures
        run: node --test scripts/cm-workflow-config.test.mjs

      - name: Run cm-ai product admission fixtures
        run: node --test scripts/cm-ai-admission.test.mjs

      - name: Run JavaScript log writer fixtures
        run: node --test scripts/cm-log-event.test.mjs

      - name: Run JavaScript test contract fixtures
        run: node --test scripts/validate-test-cases.test.mjs

      - name: Check legacy workflow config harness
        run: python3 scripts/test-workflow-config.py

      - name: Run task handoff and review gate fixtures
        run: node --test scripts/cm-task-gate.test.mjs && python3 scripts/test-task-gate.py

      - name: Scan Git history with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-install:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3aa1d7e6cbb # v4.4.0
        with:
          node-version: "22"

      - name: Exercise Windows task completion lock
        run: node --test scripts/cm-task-gate.test.mjs

      - name: Smoke-test PowerShell installer
        shell: pwsh
        run: |
          $env:CLAUDE_HOME = Join-Path $env:RUNNER_TEMP "cm-workflow-claude"
          ./install.ps1 -Force
          $required = @(
            "skills/cm-check/SKILL.md",
            "skills/cm-test/SKILL.md",
            "compat/claude-commands/cm-check.md",
            "compat/claude-commands/cm-test.md",
            "runtime/project-context.md",
            "runtime/logging.md",
            "runtime/task-gates.md",
            "runtime/task-handoff.schema.json",
            "runtime/workflow-config.md",
            "runtime/workflow-routing.md",
            "runtime/test-contract.md",
            "scripts/cm-check-runtime.sh",
            "scripts/cm-ai-admission.mjs",
            "scripts/cm-ai-admission.test.mjs",
            "scripts/cm-log-event.mjs",
            "scripts/cm-log-event.test.mjs",
            "scripts/cm-log-event.py",
            "scripts/cm-task-gate.mjs",
            "scripts/cm-task-gate.test.mjs",
            "scripts/cm-task-gate.py",
            "scripts/cm-workflow-config.mjs",
            "scripts/cm-workflow-config.test.mjs",
            "scripts/cm_workflow_config.py",
            "scripts/test-cm-log-event.py",
            "scripts/test-task-gate.py",
            "scripts/test-workflow-config.py",
            "scripts/validate-test-cases.mjs",
            "scripts/validate-test-cases.test.mjs",
            "scripts/validate-test-cases.py",
            "templates/cm-workflow.yml",
            "templates/cm-VERSION"
          )
          foreach ($relative in $required) {
            $path = Join-Path $env:CLAUDE_HOME $relative
            if (-not (Test-Path $path)) {
              throw "Missing installed file: $relative"
            }
          }
          $installedVersion = (Get-Content (Join-Path $env:CLAUDE_HOME "templates/cm-VERSION") -Raw).Trim()
          $sourceVersion = (Get-Content VERSION -Raw).Trim()
          if ($installedVersion -ne $sourceVersion) {
            throw "Installed version $installedVersion != source version $sourceVersion"
          }
          & (Join-Path $env:CLAUDE_HOME "scripts\cm-check-runtime.ps1") --log-fixtures
          if ($LASTEXITCODE -ne 0) {
            throw "CM global log fixture failed (exit $LASTEXITCODE)"
          }
          & (Join-Path $env:CLAUDE_HOME "scripts\cm-check-runtime.ps1") --routing-fixtures
          if ($LASTEXITCODE -ne 0) {
            throw "CM routing fixture failed (exit $LASTEXITCODE)"
          }
          python (Join-Path $env:CLAUDE_HOME "scripts\test-task-gate.py")
          if ($LASTEXITCODE -ne 0) {
            throw "CM task gate fixture failed (exit $LASTEXITCODE)"
          }
