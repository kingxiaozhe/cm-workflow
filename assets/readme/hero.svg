<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">CM means Create More — CM Workflow</title>
  <desc id="desc">An editorial evidence ledger showing how CM Workflow turns more ideas into reviewable, testable, and recoverable delivery.</desc>

  <rect width="1200" height="360" fill="#F4F0E8"/>
  <path d="M52 40H1148M52 320H1148M720 40V320" stroke="#151515" stroke-width="1.5"/>

  <text x="52" y="70" fill="#C44B32" font-size="18" font-weight="700"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="2">CM = CREATE MORE</text>

  <g id="identity" transform="translate(52 92)">
    <text x="0" y="72" fill="#151515" font-size="72" font-weight="700"
          font-family="Georgia, Songti SC, serif">CM Workflow</text>
    <text x="2" y="120" fill="#3E3A35" font-size="23" font-weight="550"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">让更多想法，成为可审查、可测试、可恢复的交付。</text>

    <g transform="translate(2 160)">
      <rect width="232" height="42" fill="#151515"/>
      <text x="18" y="28" fill="#F4F0E8" font-size="18" font-weight="700"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Codex  $cm-*</text>

      <rect x="246" width="270" height="42" fill="none" stroke="#151515" stroke-width="1.5"/>
      <text x="264" y="28" fill="#151515" font-size="18" font-weight="700"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Claude Code  /cm-*</text>
    </g>

    <text x="2" y="245" fill="#777168" font-size="18"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ONE CORE · TWO ENTRIES · DISK IS THE TRUTH</text>
  </g>

  <g id="ledger" transform="translate(752 56)">
    <text x="0" y="18" fill="#151515" font-size="20" font-weight="800"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">DELIVERY LEDGER</text>
    <text x="344" y="18" fill="#777168" font-size="18" text-anchor="end"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">v0.10.4</text>

    <g transform="translate(0 44)">
      <rect width="344" height="52" fill="#FAF8F2" stroke="#AAA399"/>
      <rect x="16" y="15" width="22" height="22" fill="none" stroke="#151515" stroke-width="2"/>
      <path d="M21 26l6 6 12-15" fill="none" stroke="#2E6655" stroke-width="3" stroke-linecap="square"/>
      <text x="56" y="33" fill="#151515" font-size="20" font-weight="700"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">SPEC APPROVED</text>
      <text x="324" y="33" fill="#777168" font-size="18" text-anchor="end"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace">01</text>
    </g>

    <g transform="translate(0 104)">
      <rect width="344" height="52" fill="#FAF8F2" stroke="#AAA399"/>
      <rect x="16" y="15" width="22" height="22" fill="none" stroke="#151515" stroke-width="2"/>
      <path d="M21 26l6 6 12-15" fill="none" stroke="#2E6655" stroke-width="3" stroke-linecap="square"/>
      <text x="56" y="33" fill="#151515" font-size="20" font-weight="700"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">TASK IMPLEMENTED</text>
      <text x="324" y="33" fill="#777168" font-size="18" text-anchor="end"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace">02</text>
    </g>

    <g transform="translate(0 164)">
      <rect width="344" height="52" fill="#FAF8F2" stroke="#AAA399"/>
      <rect x="16" y="15" width="22" height="22" fill="#C44B32"/>
      <path d="M21 26l6 6 12-15" fill="none" stroke="#FFF8ED" stroke-width="3" stroke-linecap="square"/>
      <text x="56" y="33" fill="#151515" font-size="20" font-weight="700"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">REVIEW</text>
      <text x="324" y="33" fill="#C44B32" font-size="18" font-weight="800" text-anchor="end"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace">REQUIRED</text>
    </g>

    <g transform="translate(0 232)">
      <text x="0" y="20" fill="#2E6655" font-size="19" font-weight="800"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace">tasks.md</text>
      <text x="126" y="20" fill="#2E6655" font-size="19" font-weight="800"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace">.reviews/</text>
      <text x="258" y="20" fill="#2E6655" font-size="19" font-weight="800"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace">运行日志</text>
      <path d="M0 34H344" stroke="#2E6655" stroke-width="3"/>
    </g>
  </g>
</svg>
