const TS = { t:18, c:24, i:18 };
const IMG = {}; let loaded = 0;
for (const k in SRC){ IMG[k]=new Image(); IMG[k].onload=()=>loaded++; IMG[k].src=SRC[k]; }

const PAL = {
  dawn:["#c98d78","#dba98a","#e8c49a"], day:["#7fa8c8","#93b9d4","#a9cbdd"],
  dusk:["#8a5f7a","#b07a6a","#d0996a"], night:["#242138","#2e2a48","#3a3560"],
  sil:{dawn:"#9a6a64",day:"#5f7f9d",dusk:"#5a4260",night:"#171523"},
  k:"#1c1a14", W:"#f5f0e8", y:"#f0b03c", G:"#6faa50",
};
const NODES = ["N1","N2","N3","N4","N5","N6","N7","N8"];
const PHASE = { N1:"启动准备", N2:"规划任务", N3:"开发中", N4:"检查代码",
                N5:"保存进度", N6:"质量检测", N7:"整理现场", N8:"收尾总结" };
const ZONE = i => i<2 ? "dawn" : i<5 ? "day" : i<7 ? "dusk" : "night";

const cv = document.getElementById("cv"), cx = cv.getContext("2d");
cx.imageSmoothingEnabled = false;
const W = cv.width, H = cv.height, GROUND = H - 40;
const SLOT = W/8, stationX = i => i*SLOT + SLOT/2;
const Z = 2; // 素材统一 2x

function rect(x,y,w,h,c){ cx.fillStyle = PAL[c]||c; cx.fillRect(x|0,y|0,w,h); }
function tile(k,gx,gy,dx,dy,z=Z){ const s=TS[k];
  cx.drawImage(IMG[k], gx*s, gy*s, s, s, dx|0, dy|0, s*z, s*z); }
const seed = n => { let x = Math.sin(n*127.1)*43758.5; return x-Math.floor(x); };

let cur = { node:"N1", state:"running", detail:"等待工作流启动…", feature:"", task:"" };
let workerX = SLOT/2, frame = 0, fireworks = [];

function sky() {
  const bandH = GROUND/3;
  for (let i=0;i<8;i++) {
    const z = PAL[ZONE(i)];
    for (let b=0;b<3;b++) rect(i*SLOT, b*bandH, SLOT, bandH+1, z[b]);
    if (i<7 && ZONE(i)!==ZONE(i+1)) {
      const zn = PAL[ZONE(i+1)];
      for (let b=0;b<3;b++) for (let yy=b*bandH; yy<(b+1)*bandH; yy+=4)
        for (let xx=0; xx<12; xx+=4) if ((xx/4+yy/4)%2) rect((i+1)*SLOT-12+xx, yy, 4, 4, zn[b]);
    }
  }
  rect(stationX(3)-8, 16, 16, 16, "#f5e8b0"); rect(stationX(3)-5, 13, 10, 22, "#f5e8b0"); // 太阳
  rect(stationX(7)+14, 14, 10, 10, "#e8e2d0"); rect(stationX(7)+17, 14, 10, 7, PAL.night[0]); // 月牙
  for (let i=0;i<10;i++){ const sx=7*SLOT+6+seed(i)*(SLOT-12), sy=6+seed(i+40)*(GROUND-100);
    if ((frame>>4)%5 !== i%5) rect(sx, sy, 2, 2, "#e8e2d0"); }
  for (let i=0;i<3;i++){ const cxp=((frame*0.15+i*150)%(5*SLOT+80))-60;  // 云(码绘,素材包无云)
    rect(cxp+4, 16+i*15, 16, 4, "#f5f0e8"); rect(cxp, 20+i*15, 26, 5, "#f5f0e8"); }
  for (let i=0;i<32;i++){ const x=i*(W/32), z=ZONE(Math.min(7,Math.floor(x/SLOT)));
    const h1 = 10+seed(i)*26, h2 = 6+seed(i+9)*12;
    rect(x, GROUND-h1, W/32+1, h1, PAL.sil[z]);
    cx.globalAlpha=.55; rect(x, GROUND-h1-h2, W/32+1, h2, PAL.sil[z]); cx.globalAlpha=1; }
}

function ground() {
  // 分区材质: 晨/昼=草地(t 1,0 / 2,0) 暮/夜=工业钢板(i 1,0 / 2,0)
  for (let x=0; x<W; x+=36) {
    const zi = Math.min(7, Math.floor(x/SLOT)), z = ZONE(zi);
    const nat = (z==="dawn"||z==="day");
    tile(nat?"t":"i", 1+((x/36)%2), 0, x, GROUND);
    if (H-GROUND > 36) tile(nat?"t":"i", 1, 1, x, GROUND+36);
  }
  // 分区地面装饰: 松树/蘑菇/仙人掌/水晶
  const DECO = { dawn:[6,6], day:[8,5], dusk:[7,6], night:[6,3] };
  for (let i=0;i<8;i++) if (i%2===0) {
    const z = ZONE(i); tile("t", DECO[z][0], DECO[z][1], i*SLOT+6, GROUND-36);
  }
}

// 每工位机器(Kenney 工业件组合)
function station(i, active, done, paused) {
  const x = stationX(i), y = GROUND;
  switch (i) {
    case 0: tile("t",6,1, x-18, y-36); break;                              // 需求箱(木箱)
    case 1: tile("i",10,3, x-18, y-36); tile("i",10,2, x-18, y-72); break; // 规划(警示牌)
    case 2: tile("i",12,2, x-18, y-36); tile("i",12,1, x-18, y-72); break; // 开发(控制台)
    case 3: tile("i",0,6, x-26, y-36); tile("i",0,5, x-26, y-72);          // 审查(机械臂)
            tile("c",0,2, x+2, y-48); break;                               // +Codex轮式机器人
    case 4: tile("i",13,2, x-18, y-36); tile("i",13,0, x-18, y-72); break; // 保存(服务器机架)
    case 5: tile("i",12,4, x-36, y-36); tile("i",13,4, x, y-36);           // 质检(齿轮机+蓝灯)
            tile("i",1,4, x-18, y-72); break;
    case 6: tile("i",9,1, x-18, y-36); tile("i",9,0, x-18, y-72); break;   // 整理(码好的物料桶)
    case 7: tile("i",7,5, x-30, y-36); tile("i",8,5, x+6, y-36);           // 发布(警戒台+火箭)
            tile("c",8,1, x-24, y-84);
            if (active || done) rect(x-14, y-38, 6, 6+(frame>>1)%6, "#f06a3c"); break;
  }
  // 悬浮铭牌(高于所有机器)
  const ly = 86;
  rect(x-17, ly, 34, 14, active ? (paused?"y":"W") : "#00000038");
  cx.fillStyle = active ? PAL.k : (done ? PAL.y : "#e8e2d0aa");
  cx.font = "bold 10px ui-monospace,monospace"; cx.textAlign = "center";
  cx.fillText(NODES[i]+PHASE[NODES[i]].slice(0,2), x, ly+10);
  if (done) { rect(x-17, ly+16, 4, 4, "G"); rect(x-13, ly+16, 4, 4, "y"); } // 完成角标
}

function draw() {
  frame++;
  if (loaded < 3) { rect(0,0,W,H,"k"); requestAnimationFrame(draw); return; }
  sky(); ground();
  const idx = Math.max(0,NODES.indexOf(cur.node)),
        paused = cur.state==="paused_for_human", done = cur.state==="done";
  for (let i=0;i<8;i++) station(i, i===idx&&!done, done||i<idx, paused);
  if (!done) {
    const targetX = stationX(idx)-52, dx = targetX-workerX;
    if (Math.abs(dx)>2) workerX += Math.sign(dx)*Math.min(2.4,Math.abs(dx));
    const walking = Math.abs(dx)>2;
    const f = walking ? (frame>>3)%2 : (frame>>5)%2;   // 走路快帧,伏案慢帧
    tile("c", f, 1, workerX, GROUND-48);
    if (paused && (frame>>4)%2) { cx.fillStyle=PAL.y; cx.font="bold 18px monospace";
      cx.textAlign="center"; cx.fillText("!", workerX+24, GROUND-54); }
  } else {
    if (frame%8===0) fireworks.push({x:40+Math.random()*(W-80), y:16+Math.random()*(GROUND-110),
      t:0, c:["#f0b03c","#f5f0e8","#f06a3c","#63b8b0","#95c86a","#8c78c8"][Math.random()*6|0]});
    fireworks = fireworks.filter(f=>f.t<24);
    for (const f of fireworks){ f.t++;
      for (let a=0;a<8;a++){ const R=f.t*1.5;
        rect(f.x+Math.cos(a*Math.PI/4)*R, f.y+Math.sin(a*Math.PI/4)*R, 2, 2, f.c); } }
    rect(W/2-92, 26, 184, 30, "W"); rect(W/2-92, 26, 184, 3, "k"); rect(W/2-92, 53, 184, 3, "k");
    rect(W/2-92, 26, 3, 30, "k"); rect(W/2+89, 26, 3, 30, "k");
    cx.fillStyle=PAL.k; cx.font="bold 17px ui-monospace,monospace"; cx.textAlign="center";
    cx.fillText("STAGE CLEAR!", W/2, 47);
    tile("c", 7, 0, stationX(3), GROUND-48);   // 庆祝的伙伴们
    tile("c", 4, 0, stationX(4), GROUND-48);
  }
  if (paused) { cx.fillStyle="rgba(18,16,26,.38)"; cx.fillRect(0,0,W,82); }
  requestAnimationFrame(draw);
}

function hud() {
  const paused = cur.state==="paused_for_human", done = cur.state==="done";
  const ph = document.getElementById("phase");
  ph.textContent = done ? "STAGE CLEAR — 全部完成" :
    (paused ? "🖐 等你确认" : `STAGE ${cur.node} · ${PHASE[cur.node]||"运行中"}`);
  ph.className = paused ? "paused" : "";
  document.getElementById("task").textContent =
    [cur.feature.replace(/^\d+\./,""), cur.task].filter(Boolean).join(" · ");
  const b = document.getElementById("bubble");
  if (cur.detail && !done) {
    b.style.display="block"; b.className = paused?"paused":"";
    b.textContent = (paused?"🖐 ":"")+cur.detail;
    const idx = Math.max(0,NODES.indexOf(cur.node));
    b.style.left = (Math.min(86,Math.max(14,(idx*SLOT+SLOT/2)/W*100))+"%");
    b.style.top = 70/H*100+"%";
  } else b.style.display="none";
}

const DEMO = [
  ["N1","running","正在检查项目环境和版本控制","",""],
  ["N2","running","正在读需求、排任务","1.market-board",""],
  ["N3","running","正在开发行情数据接口","1.market-board","T-005"],
  ["N4","running","第1轮代码审查进行中","1.market-board","T-005"],
  ["N4","paused_for_human","确认一下:原型里有3个按钮点了没反应,要做吗?","1.market-board","T-006"],
  ["N5","running","保存进度:行情页面完成","1.market-board","T-006"],
  ["N6","running","质量检测和业务走查","1.market-board",""],
  ["N7","running","整理现场,准备下一个任务","1.market-board",""],
  ["N8","running","收尾:整理文档和发布清单","",""],
  ["N8","done","全部完成","",""]];
const isDemo = new URLSearchParams(location.search).has("demo");

async function poll() {
  if (isDemo) {
    const [node,state,detail,feature,task] = DEMO[(Math.floor(Date.now()/2600))%DEMO.length];
    cur = {node,state,detail,feature,task}; setBar(4,6);
  } else {
    try {
      const s = await (await fetch(".cm-status.json?ts="+Date.now())).json();
      cur = { node:s.node||"N1", state:s.state||"running", detail:s.detail||"",
              feature:s.feature||"", task:s.task||"" };
      if (cur.feature) {
        const md = await (await fetch(cur.feature+"/tasks.md?ts="+Date.now())).text();
        const items = md.match(/^- \[( |x)\] T-\d+/gm)||[];
        setBar(items.filter(l=>l.includes("[x]")).length, items.length);
      } else setBar(0,0);
      document.getElementById("hint").textContent = "";
    } catch { document.getElementById("hint").textContent = "⏳ 等待 /cm:ai 启动(未读到状态文件)"; }
  }
  hud(); setTimeout(poll, isDemo?400:2000);
}
function setBar(d,t){
  document.getElementById("fill").style.width = t? (100*d/t)+"%" : "0";
  document.getElementById("count").textContent = t? `${d}/${t}` : "";
  document.getElementById("coins").textContent = d? `⛁ ${d}` : ""; }

draw(); poll();
</script>
